# GLOBGM run configuration. globgm_config.py turns it into <output>/config/; paths are relative to this file.

[globals]
nodata = -9999.0   # float rasters written (sub-basins use 0, as datamap requires)

[run]
# Ordered subset starting with "steady-state"; transient without spin-up starts from the steady-state heads.
phases = ["steady-state", "spin-up", "transient"]
binaries = "../../../output/run_globgm/binaries"   # where build.toml installs the tools
mf6_mode = "par"   # "ser": one process per simulation; "par": mpirun, ranks from [partition]
mpirun_args = ""

[grid]
# The global 30-arcsecond input grid; changes only with a different dataset.
ncol = 43200
nrow = 21600
xmin = -180.0
ymin = -90.0
cellsize = 0.008333333333333333
nlay = 2   # the tools hardwire two

[window]
# Degrees, snapped outward to whole cells.
# British Isles
# north = 61.0
# south = 49.8
# west = -11.0
# east = 2.0

# Australia
# north = -9.0
# south = -43.6
# west = 112.0
# east = 154.0

# Global
north = 90.0
south = -90.0
west = -180.0
east = 180.0

[inputs]
dir = "/gpfs/work4/0/prjs1222/globgm_port/input"
ldd = "lddsound_30sec_version_202005XX_correct_lat.nc"
dem = "topography_30sec_03sec/dem_average_topography_parameters_30sec_february_2021_global_covered_with_zero.nc"
confining = "confining_layer_thickness_version_2016_remapbil_to_30sec.nc"
lakes = "lakes_and_reservoirs_30sec_global_2019_version_202005XX.nc"   # waterBodyIds: never split across sub-basins
# The rest feed the derived fields; all on the 30" grid, north up. Relative to dir, or absolute.
cell_area = "/gpfs/work4/0/prjs1222/globgm_input/_data/globgm_input/cdo_grid_area_30sec_map_correct_lat.nc"
channel = "/gpfs/work4/0/prjs1222/globgm_input/_data/globgm_input/channel_parameters_30sec_february_2021_global_covered_with_zero.nc"   # bankfull width/depth, gradient, floodplain and riverbed DEM
thickness = "/gpfs/work4/0/prjs1222/globgm_input/_data/globgm_input/thickness_05min_remapbil_to_30sec_filled_with_pcr_correct_lat.nc"   # total aquifer thickness, m
ksat = "/gpfs/work4/0/prjs1222/globgm_input/_data/globgm_input/k_conductivity_aquifer_30sec_v20241001.nc"   # m/d
specific_yield = "/gpfs/work4/0/prjs1222/globgm_input/_data/globgm_input/specific_yield_aquifer_30sec_v20241001.nc"
recession = "/gpfs/work4/0/prjs1222/globgm_input/_data/globgm_input/recession_coefficient_30sec_filled_v20241001.nc"   # 1/d
unconsolidated = "/gpfs/work4/0/prjs1222/globgm_input/_data/globgm_input/unconsolidated_class_v20241001.nc"   # lithology classes of [fields.calibration]
consolidated = "/gpfs/work4/0/prjs1222/globgm_input/_data/globgm_input/consolidated_class_v20241001.nc"
carbonate = "/gpfs/work4/0/prjs1222/globgm_input/_data/globgm_input/carbonate_class_v20241001.nc"
# Monthly forcing on one time axis; steady state is its day-weighted mean, transient takes the [time] months.
recharge = "forcing_30sec_global/1979_1994/gwRecharge_monthTot_output.nc"   # m per month
abstraction = "forcing_30sec_global/1979_1994/totalGroundwaterAbstraction_monthTot_output.nc"   # m per month
discharge = "forcing_30sec_global/1979_1994/discharge_monthAvg_output.nc"   # m3/s

[subbasins]
area = 500.0   # km2 target sub-basin area (~246k sub-basins globally)

[datamap]
sea_boundary = true   # sea cells next to land become constant-head nodes
layer_threshold = 0.1001   # m of confining layer above which a cell gets two layers
max_neighbours = 100000   # datamap work-array size per catchment

[time]
start = "1979-01"   # first stress period, within the forcing; the steady state is dated this month
start_day = 1
time_units = "DAYS"
months = 12   # spin-up and transient periods; must be >= spinup_months
spinup_months = 12

[partition]
# Solution i takes datamap's i-th largest region; mpi_ranks <= submodels.
# Optional per solution: active = false, or partition_file = "<abs path>" instead of submodels/mpi_ranks.
# Global
solutions = [
  { submodels = 224, mpi_ranks = 224 },
  { submodels = 96,  mpi_ranks = 96 },
  { submodels = 32,  mpi_ranks = 32 },
  { submodels = 32,  mpi_ranks = 32 },
]

# Australia
# solutions = [
#   { submodels = 32, mpi_ranks = 32 },
#   { submodels = 2,  mpi_ranks = 2 },
# ]

# British Isles
# solutions = [
#   { submodels = 8, mpi_ranks = 8 },
#   { submodels = 4, mpi_ranks = 4 },
# ]

last_takes_remaining = true   # the last solution takes every remaining region
single_model_solutions = 0
metis_imbalance = 1.00001
mf6ggm_write = "all"   # "all" | "solutions" | [first, last] model ids
write_model_ids = true   # also write model-id rasters

[solver]
complexity = "SIMPLE"   # SIMPLE | MODERATE | COMPLEX
print_option = "ALLITER"   # NONE | SUMMARY | ALL | ALLITER
rclose_option = ""   # "" | STRICT | L2NORM_RCLOSE | RELATIVE_RCLOSE
newton = false
exchange_newton = false

[solver.ims]
# Overrides of the preset by IMS keyword.
OUTER_MAXIMUM = 10000
INNER_MAXIMUM = 150

[model]
icelltype = 0   # 0 confined, 1 convertible
force_sea = false   # sea heads forced to 0 instead of the initial head
nstp_fac = 1   # time steps per period = days in month * nstp_fac
drain_systems = 1
river_systems = 1

[model.packages]
# DRN and RCH are always on.
sto = true
riv = true
wel = true
chd = true
chd2 = true

[fields.files]
# made from [inputs] by preprocess_inputs, into <output>/preprocess_inputs/fields
# mf6ggm key (optional _L<n>[:<m>] layers, _S<n> system) = file name without .nc.
TOP = "top_uppermost_layer"
BOT_L1 = "bottom_uppermost_layer"
BOT_L2 = "bottom_lowermost_layer"
K_L1 = "horizontal_conductivity_uppermost_layer"
K_L2 = "horizontal_conductivity_lowermost_layer"
K_33_L1 = "vertical_conductivity_uppermost_layer"
K_33_L2 = "vertical_conductivity_lowermost_layer"
PRIM_STO_L1 = "primary_storage_coefficient_uppermost_layer"
PRIM_STO_L2 = "primary_storage_coefficient_lowermost_layer"
STRT_L1 = "initial_head_uppermost_layer"
STRT_L2 = "initial_head_lowermost_layer"
RECHARGE = "net_RCH"
RIV_STAGE_L1 = "surface_water_elevation"
RIV_RBOT_L1 = "surface_water_bed_elevation_used"
RIV_COND_L1 = "bed_conductance_used"
DRN_ELEV_L1 = "drain_elevation_uppermost_layer"
DRN_ELEV_L2 = "drain_elevation_lowermost_layer"
"DRN_COND_L1:2" = "drain_conductance"
WEL_Q_L1 = "abstraction_uppermost_layer"
WEL_Q_L2 = "abstraction_lowermost_layer"

[fields.calibration]
# Multipliers on kh of each lithology class, on the confining layer's kv,
# and on the river-bed resistance; 0.1 throughout in the old runs.
khuncon = 0.1
khcon = 0.1
khcar = 0.1
kvconf = 0.1
riverres = 0.1

[fields.multiply]
# Per-field multipliers by [fields.files] key.

[fields.add]
# Per-field offsets, applied after the multiplier.

[post]
phases = ["steady-state", "transient"]   # never spin-up: it saves only its last period's heads
outputs = ["wtd", "hds"]
layers = [1, 2]   # min 0 = uppermost active layer
include_sea = true
